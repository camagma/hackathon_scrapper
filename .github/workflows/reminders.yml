name: Daily hackathon reminders

on:
  schedule:
    # Daily schedule in UTC.
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

# Every run shares one state branch, including manual runs.
concurrency:
  group: devpost-reminder-state
  cancel-in-progress: false

jobs:
  reminders:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      STATE_DATABASE: data/hackathons.sqlite3
    steps:
      - name: Check out the application
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          # Git needs these credentials to fetch and push bot-state.
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Restore reminder state
        id: restore
        run: python scripts/state_db.py restore --database "$STATE_DATABASE"

      - name: Fetch hackathons and send reminders
        id: reminders
        timeout-minutes: 10
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m devpost_reminder --send-reminders --db "$STATE_DATABASE"

      - name: Save reminder state
        # A failed send must not discard flags from earlier successful sends.
        if: ${{ !cancelled() && steps.restore.outcome == 'success' && steps.reminders.outcome != 'skipped' }}
        run: |
          if [[ -f "$STATE_DATABASE" ]]; then
            python scripts/state_db.py save --database "$STATE_DATABASE"
          else
            echo "No database was created; nothing to save."
          fi
